[package]
name = "xresconv-cli"
version = "2.0.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "CLI batch convert tool for xresconv-conf convert lists, using xresloader as backend"
repository = "https://github.com/xresloader/xresconv-cli"
keywords = ["xresloader", "xresconv", "cli", "converter"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "^4.6.7", features = ["derive"] }
roxmltree = "^0.21.1"
regex = "^1.13.1"
ctrlc = { version = "^3.5.2", features = ["termination"] }
encoding_rs = "^0.8.41"

[target.'cfg(unix)'.dependencies]
libc = "^0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "^0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "^3.27.0"

[build-dependencies]
winresource = { version = "^0.1.31", default-features = false }

[[example]]
name = "fake-java"
path = "tests/support/fake_java.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
