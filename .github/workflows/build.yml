name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Rust quality gates
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          cargo +stable fmt --all --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Measure test coverage
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info --fail-under-lines 90
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, smoke: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, smoke: true }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, smoke: true }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, smoke: true }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu, packages: gcc-riscv64-linux-gnu, linker: riscv64-linux-gnu-gcc, optional: true }
          - { os: ubuntu-latest, target: aarch64-linux-android, optional: true }
          - { os: ubuntu-latest, target: x86_64-unknown-freebsd, cross: true, optional: true }
    env:
      TARGET: ${{ matrix.target }}
      BUILD_PACKAGES: ${{ matrix.packages }}
      TARGET_LINKER: ${{ matrix.linker }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Linux linkers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "$TARGET" == *-musl ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            TARGET_LINKER=musl-gcc
          elif [[ -n "$BUILD_PACKAGES" ]]; then
            sudo apt-get update
            sudo apt-get install -y "$BUILD_PACKAGES"
          fi
          if [[ "$TARGET" == aarch64-linux-android ]]; then
            TARGET_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            test -x "$TARGET_LINKER"
          fi
          if [[ -n "$TARGET_LINKER" ]]; then
            name="CARGO_TARGET_${TARGET^^}_LINKER"
            echo "${name//-/_}=$TARGET_LINKER" >> "$GITHUB_ENV"
          fi
      - name: Build
        shell: bash
        env:
          USE_CROSS: ${{ matrix.cross }}
        run: |
          if [[ "$USE_CROSS" == true ]]; then
            cargo install cross --locked
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
      - name: Smoke test native release binary
        if: matrix.smoke == true && runner.os != 'Windows'
        shell: bash
        run: |
          exe="target/$TARGET/release/xresconv-cli"
          test -x "$exe"
          file "$exe"
          "$exe" --version
          "$exe" --help
          mkdir -p .smoke
          : > .smoke/xresloader.jar
          printf '%s\n' '<root><list><item file="data.xlsx" scheme="test"/></list></root>' > .smoke/list.xml
          "$exe" --test .smoke/list.xml
      - name: Smoke test Windows release binary
        if: matrix.smoke == true && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path -LiteralPath "target/$env:TARGET/release/xresconv-cli.exe").Path
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'version smoke failed' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'help smoke failed' }
          New-Item -ItemType Directory -Path '.smoke' -Force | Out-Null
          Set-Content -LiteralPath '.smoke/xresloader.jar' -Value ''
          Set-Content -LiteralPath '.smoke/list.xml' -Value '<root><list><item file="data.xlsx" scheme="test"/></list></root>'
          & $exe --test .smoke/list.xml
          if ($LASTEXITCODE -ne 0) { throw 'preview smoke failed' }
      - name: Package with checksum
        shell: pwsh
        run: ./scripts/release.ps1 -Mode Package -Target $env:TARGET
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
