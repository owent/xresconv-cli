name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust quality gates
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          cargo +stable fmt --all --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Measure test coverage
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info --fail-under-lines 90
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      asset: ${{ steps.release.outputs.asset }}
      digest: ${{ steps.release.outputs.digest }}
      java_lts: ${{ steps.release.outputs.java_lts }}
    steps:
      - name: Resolve latest xresloader release and latest Temurin LTS
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release="$(gh api repos/xresloader/xresloader/releases/latest)"
          tag="$(jq -er '.tag_name | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$release")"
          asset="xresloader-${tag#v}.jar"
          digest="$(jq -er --arg name "$asset" '[.assets[] | select(.name == $name) | .digest] | if length == 1 then .[0] else empty end | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$release")"
          java_lts="$(curl --fail --silent --show-error --location --retry 3 --max-time 20 https://api.adoptium.net/v3/info/available_releases | jq -er '.most_recent_lts | select(type == "number" and . >= 17)')"
          printf 'tag=%s\nasset=%s\ndigest=%s\njava_lts=%s\n' "$tag" "$asset" "$digest" "$java_lts" >> "$GITHUB_OUTPUT"
          printf 'xresloader %s, Temurin LTS %s\n' "$tag" "$java_lts"

  integration:
    name: Real xresloader (${{ matrix.os }})
    needs: backend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ needs.backend.outputs.java_lts }}
          check-latest: true
      - uses: actions/checkout@v7
        with:
          repository: xresloader/xresloader
          ref: ${{ needs.backend.outputs.tag }}
          path: xresloader-src
          sparse-checkout: sample
          lfs: false
          persist-credentials: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Materialize and verify Git LFS sample
        shell: bash
        run: |
          git -C xresloader-src lfs pull --include='sample/资源转换示例.xlsx' --exclude=''
          python - <<'PY'
          from pathlib import Path
          sample = Path('xresloader-src/sample/资源转换示例.xlsx')
          if not sample.is_file() or sample.stat().st_size < 1000 or sample.open('rb').read(4) != b'PK\x03\x04':
              raise SystemExit(f'Excel sample is missing or still a Git LFS pointer: {sample}')
          print(f'Materialized sample: {sample.stat().st_size} bytes')
          PY
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Download latest backend and run integration tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_TAG: ${{ needs.backend.outputs.tag }}
          BACKEND_ASSET: ${{ needs.backend.outputs.asset }}
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path '.e2e' -Force | Out-Null
          gh release download $env:BACKEND_TAG --repo xresloader/xresloader --pattern $env:BACKEND_ASSET --dir .e2e
          if ($LASTEXITCODE -ne 0) { throw 'backend download failed' }
          $env:XRESCONV_E2E_JAR = (Resolve-Path -LiteralPath (Join-Path '.e2e' $env:BACKEND_ASSET)).Path
          $expected = $env:BACKEND_DIGEST.Substring(7)
          if ((Get-FileHash -LiteralPath $env:XRESCONV_E2E_JAR -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'backend checksum mismatch' }
          $env:XRESCONV_E2E_SAMPLE_DIR = (Resolve-Path -LiteralPath 'xresloader-src/sample').Path
          cargo test --workspace --locked --test real_backend -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'real backend tests failed' }

  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, smoke: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, smoke: true }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, smoke: true }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, smoke: true }
          - { os: windows-latest, target: i686-pc-windows-msvc, smoke: true, optional: true }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu, packages: gcc-multilib, optional: true }
          - { os: ubuntu-latest, target: armv7-unknown-linux-gnueabihf, packages: gcc-arm-linux-gnueabihf, linker: arm-linux-gnueabihf-gcc, optional: true }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu, packages: gcc-riscv64-linux-gnu, linker: riscv64-linux-gnu-gcc, optional: true }
          - { os: ubuntu-latest, target: aarch64-linux-android, optional: true }
          - { os: ubuntu-latest, target: x86_64-unknown-freebsd, cross: true, optional: true }
    env:
      TARGET: ${{ matrix.target }}
      BUILD_PACKAGES: ${{ matrix.packages }}
      TARGET_LINKER: ${{ matrix.linker }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Linux linkers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "$TARGET" == *-musl ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            TARGET_LINKER=musl-gcc
          elif [[ -n "$BUILD_PACKAGES" ]]; then
            sudo apt-get update
            sudo apt-get install -y "$BUILD_PACKAGES"
          fi
          if [[ "$TARGET" == aarch64-linux-android ]]; then
            TARGET_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            test -x "$TARGET_LINKER"
          fi
          if [[ -n "$TARGET_LINKER" ]]; then
            name="CARGO_TARGET_${TARGET^^}_LINKER"
            echo "${name//-/_}=$TARGET_LINKER" >> "$GITHUB_ENV"
          fi
      - name: Build
        shell: bash
        env:
          USE_CROSS: ${{ matrix.cross }}
        run: |
          if [[ "$USE_CROSS" == true ]]; then
            cargo install cross --locked
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
      - name: Smoke test native release binary
        if: matrix.smoke == true && runner.os != 'Windows'
        shell: bash
        run: |
          exe="target/$TARGET/release/xresconv-cli"
          test -x "$exe"
          file "$exe"
          "$exe" --version
          "$exe" --help
          mkdir -p .smoke
          : > .smoke/xresloader.jar
          printf '%s\n' '<root><list><item file="data.xlsx" scheme="test"/></list></root>' > .smoke/list.xml
          "$exe" --test .smoke/list.xml
      - name: Smoke test Windows release binary
        if: matrix.smoke == true && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path -LiteralPath "target/$env:TARGET/release/xresconv-cli.exe").Path
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'version smoke failed' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'help smoke failed' }
          New-Item -ItemType Directory -Path '.smoke' -Force | Out-Null
          Set-Content -LiteralPath '.smoke/xresloader.jar' -Value ''
          Set-Content -LiteralPath '.smoke/list.xml' -Value '<root><list><item file="data.xlsx" scheme="test"/></list></root>'
          & $exe --test .smoke/list.xml
          if ($LASTEXITCODE -ne 0) { throw 'preview smoke failed' }
      - name: Package with checksum
        shell: pwsh
        run: ./scripts/release.ps1 -Mode Package -Target $env:TARGET
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
